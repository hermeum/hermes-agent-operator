name: Test Chart

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    env:
      IMG: controller:latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Create kind cluster
        run: kind create cluster

      - name: Prepare hermes-agent-operator
        run: |
          go mod tidy
          make docker-build
          kind load docker-image $IMG

      - name: Install Helm
        run: make install-helm

      - name: Lint Helm Chart
        run: |
          helm lint ./dist/chart
          helm lint ./dist/chart --set certManager.enabled=true --set prometheus.enabled=true
          # The `ServiceMonitor` renders only when metrics are enabled.
          helm template t ./dist/chart --set prometheus.enabled=true > /tmp/monitor-on.yaml
          grep -q 'kind: ServiceMonitor' /tmp/monitor-on.yaml
          helm template t ./dist/chart --set prometheus.enabled=true --set metrics.enabled=false > /tmp/monitor-off.yaml
          if grep -q 'kind: ServiceMonitor' /tmp/monitor-off.yaml; then
            echo "ServiceMonitor rendered with metrics.enabled=false" >&2
            exit 1
          fi

      - name: Install cert-manager via Helm (wait for readiness)
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm install cert-manager jetstack/cert-manager \
            --version v1.20.2 \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --wait \
            --timeout 300s

      - name: Install Prometheus Operator CRDs
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm install prometheus-crds prometheus-community/prometheus-operator-crds \
            --version 32.0.1

      - name: Deploy manager via Helm
        run: |
          make helm-deploy

      - name: Upgrade with cert-manager and Prometheus enabled
        run: |
          make helm-deploy HELM_EXTRA_ARGS="--set certManager.enabled=true --set prometheus.enabled=true"

      - name: Verify the metrics certificate is issued and served
        run: |
          make helm-verify-metrics-cert

      - name: Check Helm release status
        run: |
          make helm-status
